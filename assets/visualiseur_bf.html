<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BF Visualiseur</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030811; }
    body { font-family: "JetBrains Mono", "Segoe UI", monospace; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; inset: 0; pointer-events: none; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .eyebrow { color: #5de5ff; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
    .state { margin-top: 7px; color: #e8fbff; font-size: 13px; letter-spacing: .08em; }
    .meter { width: 100px; height: 3px; margin-top: 12px; overflow: hidden; background: #12283b; }
    .meter span { display: block; width: 20%; height: 100%; background: #5de5ff; box-shadow: 0 0 14px #5de5ff; transition: width 120ms ease-out; }
    .footer { display: flex; justify-content: space-between; align-items: end; color: #526f82; font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    .hint { color: #6b9bb0; }
  </style>
</head>
<body>
  <div class="hud">
    <div><div class="eyebrow">BF / QUANTUM VOICE CORE</div><div class="state" id="state">EN ATTENTE</div><div class="meter"><span id="meter"></span></div></div>
    <div class="footer"><span>LOCAL AUDIO ANALYSIS</span><span class="hint">WEB AUDIO / THREE.JS</span></div>
  </div>
  <script type="module">
    import * as THREE from './three.module.js';
    (() => {
      const stateLabel = document.getElementById('state');
      const meter = document.getElementById('meter');
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030811, 0.045);
      const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 0, 8.2);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      document.body.prepend(renderer.domElement);

      const root = new THREE.Group();
      scene.add(root);
      scene.add(new THREE.AmbientLight(0x15344d, 1.8));
      const cyanLight = new THREE.PointLight(0x36dcff, 8, 16);
      cyanLight.position.set(2.5, 2.5, 4);
      scene.add(cyanLight);
      const rimLight = new THREE.PointLight(0x6c63ff, 5, 13);
      rimLight.position.set(-3, -2, 2);
      scene.add(rimLight);

      const baseGeometry = new THREE.IcosahedronGeometry(1.55, 5);
      const basePositions = baseGeometry.attributes.position.array.slice();
      const coreMaterial = new THREE.MeshPhysicalMaterial({ color: 0x28cfee, emissive: 0x063949, emissiveIntensity: 1.7, roughness: .25, metalness: .65, transparent: true, opacity: .82, wireframe: true });
      const core = new THREE.Mesh(baseGeometry, coreMaterial);
      root.add(core);

      const haloMaterial = new THREE.MeshBasicMaterial({ color: 0x149dcc, transparent: true, opacity: .08, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false });
      const halo = new THREE.Mesh(new THREE.SphereGeometry(1.72, 32, 20), haloMaterial);
      root.add(halo);

      const ringGroup = new THREE.Group();
      root.add(ringGroup);
      const rings = [];
      for (let i = 0; i < 4; i++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(2.1 + i * .24, .012, 8, 96), new THREE.MeshBasicMaterial({ color: 0x45dfff, transparent: true, opacity: .38 - i * .06, blending: THREE.AdditiveBlending }));
        ring.rotation.set(i * .42, i * .7, i * .23);
        ring.userData.phase = i * 1.7;
        ringGroup.add(ring);
        rings.push(ring);
      }

      const particleCount = 900;
      const particlePositions = new Float32Array(particleCount * 3);
      const particleSeeds = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        const radius = 2.35 + Math.random() * 1.7;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const index = i * 3;
        particleSeeds[index] = radius;
        particleSeeds[index + 1] = theta;
        particleSeeds[index + 2] = phi;
        particlePositions[index] = radius * Math.sin(phi) * Math.cos(theta);
        particlePositions[index + 1] = radius * Math.cos(phi);
        particlePositions[index + 2] = radius * Math.sin(phi) * Math.sin(theta);
      }
      const particleGeometry = new THREE.BufferGeometry();
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
      const particles = new THREE.Points(particleGeometry, new THREE.PointsMaterial({ color: 0x69e7ff, size: .025, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false }));
      root.add(particles);

      const analyser = new (window.AudioContext || window.webkitAudioContext)();
      const audioAnalyser = analyser.createAnalyser();
      audioAnalyser.fftSize = 256;
      const audioData = new Uint8Array(audioAnalyser.frequencyBinCount);
      let audioReady = false;
      let simulatedAmplitude = 0;
      let targetAmplitude = 0;
      let visualState = 'idle';
      let responseColor = new THREE.Color(0x28cfee);
      let targetColor = new THREE.Color(0x28cfee);

      async function connectMicrophone() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = analyser.createMediaStreamSource(stream);
          source.connect(audioAnalyser);
          audioReady = true;
          setState('listening');
        } catch (_) { setState('idle'); }
      }
      window.addEventListener('click', connectMicrophone, { once: true });

      window.bfSetState = (nextState) => {
        visualState = nextState || 'idle';
        if (visualState === 'responding') targetColor.set(0x6d82ff);
        else if (visualState === 'processing') targetColor.set(0x45a9ff);
        else targetColor.set(0x28cfee);
        setState(visualState);
      };
      function setState(nextState) {
        const labels = { idle: 'EN ATTENTE', listening: 'EN ECOUTE', processing: 'TRAITEMENT', responding: 'REPONSE' };
        stateLabel.textContent = labels[nextState] || labels.idle;
      }
      function sampleAmplitude() {
        if (audioReady) {
          audioAnalyser.getByteFrequencyData(audioData);
          let sum = 0;
          for (let i = 0; i < audioData.length; i++) sum += audioData[i];
          return Math.min(1, sum / audioData.length / 128);
        }
        return 0;
      }
      function animate(time) {
        requestAnimationFrame(animate);
        const t = time * .001;
        targetAmplitude = Math.max(sampleAmplitude(), visualState === 'responding' ? .16 + Math.sin(t * 4) * .06 : 0);
        simulatedAmplitude += (targetAmplitude - simulatedAmplitude) * .12;
        const pulse = .035 + simulatedAmplitude * .25 + Math.sin(t * 1.3) * .012;
        const scale = 1 + pulse;
        root.scale.setScalar(scale);
        core.rotation.y = t * .12;
        core.rotation.x = Math.sin(t * .25) * .12;
        halo.scale.setScalar(1 + simulatedAmplitude * .22);
        responseColor.lerp(targetColor, .045);
        coreMaterial.color.copy(responseColor);
        coreMaterial.emissive.copy(responseColor).multiplyScalar(.16);
        coreMaterial.emissiveIntensity = 1.4 + simulatedAmplitude * 3;
        ringGroup.rotation.y = t * .08;
        rings.forEach((ring) => { ring.scale.setScalar(1 + ((t * .12 + ring.userData.phase) % 1) * simulatedAmplitude * 1.8); ring.material.opacity = .16 + simulatedAmplitude * .35; });
        particles.rotation.y = t * (.025 + simulatedAmplitude * .3);
        const positions = particleGeometry.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          const index = i * 3;
          const radius = particleSeeds[index] + simulatedAmplitude * .7;
          const theta = particleSeeds[index + 1] + t * (.08 + simulatedAmplitude * .65) * (i % 2 ? 1 : -1);
          const phi = particleSeeds[index + 2];
          positions[index] = radius * Math.sin(phi) * Math.cos(theta);
          positions[index + 1] = radius * Math.cos(phi);
          positions[index + 2] = radius * Math.sin(phi) * Math.sin(theta);
        }
        particleGeometry.attributes.position.needsUpdate = true;
        meter.style.width = `${Math.max(20, Math.round(simulatedAmplitude * 100))}%`;
        renderer.render(scene, camera);
      }
      addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
      animate(0);
    })();
  </script>
</body>
</html>
