<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BF Visualiseur</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0e1c; }
  body { font-family: "Segoe UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .etat {
    position: fixed; left: 16px; bottom: 14px; pointer-events: none;
    color: #7fa6c9; font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    text-shadow: 0 0 8px rgba(93,232,255,.5);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="etat" id="etat">EN ATTENTE</div>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const etiquetteEtat = document.getElementById('etat');
  const LIBELLES = { idle: 'EN ATTENTE', listening: 'EN ECOUTE', processing: 'TRAITEMENT', responding: 'REPONSE' };

  let largeur = 0;
  let hauteur = 0;
  function redimensionner() {
    const ratio = Math.min(devicePixelRatio || 1, 2);
    largeur = innerWidth;
    hauteur = innerHeight;
    canvas.width = largeur * ratio;
    canvas.height = hauteur * ratio;
    canvas.style.width = largeur + 'px';
    canvas.style.height = hauteur + 'px';
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  addEventListener('resize', redimensionner);
  redimensionner();

  // --- Etat piloté depuis Python (assistant_bf.py) -------------------------
  let etatVisuel = 'idle';
  window.bfSetState = (nouvelEtat) => {
    etatVisuel = nouvelEtat || 'idle';
    etiquetteEtat.textContent = LIBELLES[etatVisuel] || LIBELLES.idle;
  };

  // --- Amplitude du micro (purement decoratif, reagit au son ambiant) ------
  let audioPret = false;
  let analyseur = null;
  let donneesAudio = null;
  async function connecterMicrophone() {
    try {
      const contexte = new (window.AudioContext || window.webkitAudioContext)();
      const flux = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = contexte.createMediaStreamSource(flux);
      analyseur = contexte.createAnalyser();
      analyseur.fftSize = 256;
      source.connect(analyseur);
      donneesAudio = new Uint8Array(analyseur.frequencyBinCount);
      audioPret = true;
    } catch (_) {
      audioPret = false;
    }
  }
  addEventListener('click', connecterMicrophone, { once: true });

  function amplitudeMicro() {
    if (!audioPret) return null;
    analyseur.getByteFrequencyData(donneesAudio);
    let somme = 0;
    for (let i = 0; i < donneesAudio.length; i++) somme += donneesAudio[i];
    return Math.min(1, somme / donneesAudio.length / 110);
  }

  // --- Champ d'etoiles fixe -------------------------------------------------
  const etoiles = Array.from({ length: 130 }, () => ({
    x: Math.random(),
    y: Math.random(),
    rayon: Math.random() * 1.3 + 0.25,
    phase: Math.random() * Math.PI * 2,
    vitesse: 0.6 + Math.random() * 1.2,
  }));

  // --- Chapelet de globes filaires (cyan a gauche -> magenta a droite) -----
  const NB_GLOBES = 11;
  const globes = Array.from({ length: NB_GLOBES }, (_, i) => ({
    t: i / (NB_GLOBES - 1),
    dephasage: Math.random() * Math.PI * 2,
  }));

  function gaussienne(x, centre, largeurCourbe) {
    const d = (x - centre) / largeurCourbe;
    return Math.exp(-d * d);
  }

  function teinteChapelet(t) {
    // 190 = cyan, 230 = bleu, 300 = violet, 325 = magenta
    return 190 + t * 140;
  }

  function dessinerGlobeFilaire(cx, cy, rayon, teinte, opacite, rotation) {
    if (rayon < 1.2 || opacite < 0.02) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `hsla(${teinte}, 85%, 68%, ${opacite})`;
    ctx.lineWidth = Math.max(0.5, rayon * 0.03);

    ctx.beginPath();
    ctx.arc(cx, cy, rayon, 0, Math.PI * 2);
    ctx.stroke();

    // lignes de "latitude"
    for (let i = 1; i <= 2; i++) {
      const frac = i / 3;
      const rx = rayon * Math.sin(frac * Math.PI);
      const decalageY = rayon * Math.cos(frac * Math.PI);
      ctx.beginPath();
      ctx.ellipse(cx, cy + decalageY, rx, rayon * 0.24, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx, cy - decalageY, rx, rayon * 0.24, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // lignes de "meridien"
    for (let i = 0; i < 3; i++) {
      const angle = rotation + (i * Math.PI) / 3;
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.abs(rayon * Math.cos(angle)) + 0.4, rayon, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // --- Nebuleuse centrale (halo cyan + magenta fusionnes) -------------------
  function dessinerNebuleuse(cx, cy, rayon, intensite) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const glow1 = ctx.createRadialGradient(cx - rayon * 0.22, cy, 0, cx - rayon * 0.22, cy, rayon * 1.25);
    glow1.addColorStop(0, `hsla(192, 95%, 62%, ${0.5 * intensite})`);
    glow1.addColorStop(1, 'hsla(192, 95%, 62%, 0)');
    ctx.fillStyle = glow1;
    ctx.beginPath();
    ctx.arc(cx, cy, rayon * 1.25, 0, Math.PI * 2);
    ctx.fill();

    const glow2 = ctx.createRadialGradient(cx + rayon * 0.26, cy, 0, cx + rayon * 0.26, cy, rayon * 1.25);
    glow2.addColorStop(0, `hsla(322, 90%, 62%, ${0.5 * intensite})`);
    glow2.addColorStop(1, 'hsla(322, 90%, 62%, 0)');
    ctx.fillStyle = glow2;
    ctx.beginPath();
    ctx.arc(cx, cy, rayon * 1.25, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // --- Anneau de reperes en pointilles ---------------------------------------
  function dessinerAnneauReperes(cx, cy, rayon, rotation, opacite) {
    const nombre = 34;
    ctx.save();
    for (let i = 0; i < nombre; i++) {
      const angle = rotation + (i / nombre) * Math.PI * 2;
      const teinte = 190 + ((Math.cos(angle) + 1) / 2) * 140;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(angle) * rayon, cy + Math.sin(angle) * rayon, 1.3, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${teinte}, 90%, 70%, ${opacite})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // --- Disque central sombre --------------------------------------------------
  function dessinerDisque(cx, cy, rayon, rotation) {
    const degrade = ctx.createRadialGradient(cx, cy - rayon * 0.15, rayon * 0.1, cx, cy, rayon);
    degrade.addColorStop(0, '#131c30');
    degrade.addColorStop(1, '#060911');
    ctx.beginPath();
    ctx.arc(cx, cy, rayon, 0, Math.PI * 2);
    ctx.fillStyle = degrade;
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(130, 210, 255, .35)';
    ctx.stroke();

    const nDots = 46;
    for (let i = 0; i < nDots; i++) {
      const angle = rotation * -1.4 + (i / nDots) * Math.PI * 2;
      const rr = rayon * 0.84;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(angle) * rr, cy + Math.sin(angle) * rr, 1, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(150, 220, 255, .32)';
      ctx.fill();
    }
  }

  // --- Icone microphone --------------------------------------------------------
  function dessinerMicro(cx, cy, taille, couleur, lueur) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowColor = couleur;
    ctx.shadowBlur = lueur;
    ctx.fillStyle = couleur;
    ctx.strokeStyle = couleur;

    const largeurCorps = taille * 0.34;
    const hauteurCorps = taille * 0.62;
    ctx.beginPath();
    ctx.moveTo(-largeurCorps / 2, -hauteurCorps / 2 + largeurCorps / 2);
    ctx.arcTo(-largeurCorps / 2, -hauteurCorps / 2, 0, -hauteurCorps / 2, largeurCorps / 2);
    ctx.arcTo(largeurCorps / 2, -hauteurCorps / 2, largeurCorps / 2, -hauteurCorps / 2 + largeurCorps / 2, largeurCorps / 2);
    ctx.lineTo(largeurCorps / 2, hauteurCorps / 2 - largeurCorps / 2);
    ctx.arcTo(largeurCorps / 2, hauteurCorps / 2, 0, hauteurCorps / 2, largeurCorps / 2);
    ctx.arcTo(-largeurCorps / 2, hauteurCorps / 2, -largeurCorps / 2, hauteurCorps / 2 - largeurCorps / 2, largeurCorps / 2);
    ctx.closePath();
    ctx.fill();

    ctx.lineWidth = taille * 0.045;
    ctx.beginPath();
    ctx.arc(0, hauteurCorps * 0.12, taille * 0.32, Math.PI * 0.12, Math.PI * 0.88);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, hauteurCorps * 0.5);
    ctx.lineTo(0, hauteurCorps * 0.7);
    ctx.moveTo(-taille * 0.13, hauteurCorps * 0.7);
    ctx.lineTo(taille * 0.13, hauteurCorps * 0.7);
    ctx.stroke();

    ctx.restore();
  }

  // --- Boucle d'animation -------------------------------------------------------
  let amplitudeLissee = 0;

  function animer(temps) {
    requestAnimationFrame(animer);
    const t = temps * 0.001;
    ctx.clearRect(0, 0, largeur, hauteur);

    // fond degrade tres subtil
    const fond = ctx.createLinearGradient(0, 0, largeur, hauteur);
    fond.addColorStop(0, '#0a0e1c');
    fond.addColorStop(1, '#0c0f1e');
    ctx.fillStyle = fond;
    ctx.fillRect(0, 0, largeur, hauteur);

    // etoiles scintillantes
    for (const etoile of etoiles) {
      const scintillement = 0.5 + 0.5 * Math.sin(t * etoile.vitesse + etoile.phase);
      ctx.beginPath();
      ctx.arc(etoile.x * largeur, etoile.y * hauteur, etoile.rayon, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180, 220, 255, ${0.15 + scintillement * 0.35})`;
      ctx.fill();
    }

    // amplitude : reelle si le micro navigateur est autorise, sinon simulee
    let cible;
    const mesure = amplitudeMicro();
    if (mesure !== null && etatVisuel === 'listening') {
      cible = mesure;
    } else if (etatVisuel === 'listening') {
      cible = 0.22 + Math.sin(t * 2.4) * 0.12 + Math.sin(t * 5.3) * 0.05;
    } else if (etatVisuel === 'responding') {
      cible = 0.28 + Math.sin(t * 4.2) * 0.14 + Math.sin(t * 9) * 0.05;
    } else if (etatVisuel === 'processing') {
      cible = 0.2 + Math.sin(t * 6) * 0.08;
    } else {
      cible = 0.06 + Math.sin(t * 0.9) * 0.03;
    }
    amplitudeLissee += (Math.max(0, cible) - amplitudeLissee) * 0.12;

    const cx = largeur / 2;
    const cy = hauteur / 2;
    const echelle = Math.min(largeur, hauteur);
    const vitesseRotation = etatVisuel === 'processing' ? 0.5 : 0.12;
    const rotation = t * vitesseRotation;

    // chapelet de globes filaires, en arriere-plan
    const demiEtendue = largeur * 0.46;
    for (const globe of globes) {
      const x = cx + (globe.t - 0.5) * 2 * demiEtendue;
      const rayonBase = echelle * (0.02 + 0.085 * gaussienne(globe.t, 0.5, 0.3));
      const pulsation = 1 + amplitudeLissee * 0.5 * gaussienne(globe.t, 0.5, 0.4);
      const bordFondu = gaussienne(globe.t, 0.5, 0.62);
      dessinerGlobeFilaire(
        x,
        cy,
        rayonBase * pulsation,
        teinteChapelet(globe.t),
        0.5 * bordFondu,
        rotation * 1.4 + globe.dephasage
      );
    }

    // nebuleuse + anneau + disque + micro, au premier plan
    const rayonCentral = echelle * (0.155 + amplitudeLissee * 0.05);
    dessinerNebuleuse(cx, cy, rayonCentral, 0.75 + amplitudeLissee * 0.6);
    dessinerAnneauReperes(cx, cy, rayonCentral * 1.32, rotation, 0.55 + amplitudeLissee * 0.3);
    dessinerDisque(cx, cy, rayonCentral * 0.86, rotation);

    const couleurMicro = etatVisuel === 'responding' ? '#ff8fd6' : '#5de8ff';
    dessinerMicro(cx, cy, rayonCentral * 0.78, couleurMicro, 18 + amplitudeLissee * 30);

    ctx.fillStyle = `rgba(120, 200, 255, ${0.12 + amplitudeLissee * 0.15})`;
  }

  requestAnimationFrame(animer);
})();
</script>
</body>
</html>
